name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write   # needed to publish the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web files (bundle Supabase + native plugins, stamp build number)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: npm run prepare-www

      - name: Create native Android project
        run: npx cap add android

      - name: App icon + splash screen from assets/
        run: npx capacitor-assets generate --android

      - name: Register the sign-in return link in the Android manifest
        run: node scripts/patch-android.mjs

      - name: Set app version (increments every build)
        run: |
          VER=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VER}\"/" android/app/build.gradle
          grep -n -E "versionCode|versionName" android/app/build.gradle

      - name: Sync web files into Android project
        run: npx cap sync android

      - name: Build release APK (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK with your keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > release.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out creator-booth.apk aligned.apk
          "$BT/apksigner" verify creator-booth.apk
          rm -f release.keystore aligned.apk

      - name: Package the web files as an over-the-air update
        run: |
          (cd www && zip -r ../bundle.zip . -x '.*')
          unzip -l bundle.zip | grep -E " index.html$" || (echo "index.html must be at the top of bundle.zip" && exit 1)

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Creator Booth (latest)
          files: |
            creator-booth.apk
            bundle.zip
            www/version.json
